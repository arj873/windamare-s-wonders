<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 300">
<title>Great Work frame (4 tiers)</title>
<!-- A slim tower of four stacked bands, built bottom-up as labour fills tiers. Ids tier-1..4 (tier-1 is the base); fill a tier with the host's own colour when complete. -->
<rect x="6" y="276" width="148" height="18" rx="6" fill="#5e2914" stroke="#1e0c04" stroke-width="3"/>
<rect id="tier-1" x="20" y="200" width="120" height="76" rx="8" fill="#ecdcc0" stroke="#1e0c04" stroke-width="3"/>
<rect id="tier-2" x="32" y="130" width="96" height="70" rx="8" fill="#ecdcc0" stroke="#1e0c04" stroke-width="3"/>
<rect id="tier-3" x="44" y="68" width="72" height="62" rx="8" fill="#ecdcc0" stroke="#1e0c04" stroke-width="3"/>
<rect id="tier-4" x="56" y="16" width="48" height="52" rx="8" fill="#ecdcc0" stroke="#1e0c04" stroke-width="3"/>
<g fill="#1e0c04" font-family="Marcellus, serif" font-size="20" text-anchor="middle"><text x="80" y="246">I</text><text x="80" y="172">II</text><text x="80" y="106">III</text><text x="80" y="50">IV</text></g>
<circle cx="80" cy="10" r="6" fill="var(--accent,#f5b82e)" stroke="#1e0c04" stroke-width="2"/>
</svg>
