<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
<title>Round and timer badge</title>
<!-- Cobalt glazed disc. ring-track and ring-fill (id) form a timer arc: animate stroke-dashoffset (circumference 251.3). Centre text is HTML-overlaid. -->
<circle cx="48" cy="48" r="44" fill="#1f4fa0" stroke="#1e0c04" stroke-width="4"/>
<circle id="ring-track" cx="48" cy="48" r="40" fill="none" stroke="#f6ead4" stroke-opacity=".35" stroke-width="6"/>
<circle id="ring-fill" cx="48" cy="48" r="40" fill="none" stroke="#f5b82e" stroke-width="6" stroke-linecap="round" stroke-dasharray="251.3" stroke-dashoffset="62.8" transform="rotate(-90 48 48)"/>
<circle cx="48" cy="48" r="30" fill="#fbf3e2" stroke="#1e0c04" stroke-width="2.5"/>
</svg>
