<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120">
<title>Seat panel</title>
<!-- Terracotta panel. Sockets: avatar (circle), name plate, tableau strip. Seat colour is a notch, not just a colour: see seat-marker in ART.md. -->
<rect x="3" y="3" width="314" height="114" rx="14" fill="#96452a" stroke="#5e2914" stroke-width="4"/>
<rect x="9" y="9" width="302" height="102" rx="10" fill="none" stroke="#e09a72" stroke-opacity=".5" stroke-width="1.5"/>
<circle id="avatar" cx="56" cy="50" r="30" fill="#fbf3e2" stroke="#3a1a0c" stroke-width="3"/>
<rect id="name" x="98" y="22" width="206" height="30" rx="8" fill="#fbf3e2" stroke="#3a1a0c" stroke-width="2"/>
<rect id="tableau" x="98" y="60" width="206" height="44" rx="8" fill="#3c1204" fill-opacity=".35"/>
<rect id="plaque" x="22" y="88" width="68" height="20" rx="10" fill="#fbf3e2" stroke="#3a1a0c" stroke-width="2"/>
</svg>
